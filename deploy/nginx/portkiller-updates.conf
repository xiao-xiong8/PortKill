# 独立 HTTP 静态发布服务。URL：http://服务器公网IP:8080/stable/manifest.json
# 安装前确认 /etc/nginx/nginx.conf 的 http 块包含 conf.d/*.conf。
server {
    listen 8080 default_server;
    server_name _;

    root /srv/portkiller-updates;
    server_tokens off;
    autoindex off;
    sendfile on;
    etag on;
    max_ranges 1;
    gzip off;

    access_log /var/log/nginx/portkiller-updates.access.log;
    error_log /var/log/nginx/portkiller-updates.error.log;

    location = /stable/events {
        proxy_pass http://127.0.0.1:8091/stable/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Accept-Encoding "";
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 15s;
        proxy_redirect off;
        limit_except GET { deny all; }
    }

    location = /stable/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Accept-Ranges bytes;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location ~ ^/stable/PortKiller-[0-9.]+-win-x64[.]zip$ {
        default_type application/zip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    # 只开放上述清单及版本包，不公开临时上传文件和其他文件。
    location / { return 404; }
}
